name: temp-plugin-center-build

on:
  workflow_dispatch:
  push:
    branches: [plugin/protocol-v1]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ghcr.io/izerok/gately-plugin-center-unofficial:plugin-center-v1.0
          build-args: |
            VERSION=plugin-center-v1.0
            COMMIT=${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d --name gately-smoke -p 16681:16680 ghcr.io/izerok/gately-plugin-center-unofficial:plugin-center-v1.0
          code="000"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:16681/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then echo "smoke http=$code"; break; fi
            sleep 2
          done
          docker logs gately-smoke 2>&1 | tail -20
          docker stop gately-smoke
          docker rm gately-smoke
          test -n "$code" && test "$code" != "000"
      - name: Check python3
        run: docker run --rm --entrypoint python3 ghcr.io/izerok/gately-plugin-center-unofficial:plugin-center-v1.0 --version
      - name: Push image
        run: docker push ghcr.io/izerok/gately-plugin-center-unofficial:plugin-center-v1.0
      - name: Save image tar
        run: |
          docker save -o gately-plugin-center-v1.0.tar ghcr.io/izerok/gately-plugin-center-unofficial:plugin-center-v1.0
          ls -la gately-plugin-center-v1.0.tar
      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: gately-plugin-center-v1.0-image-tar
          path: gately-plugin-center-v1.0.tar
