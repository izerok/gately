# 临时：导航页内置镜像的 Actions 构建 + 推 GHCR（tag: test）。
# 镜像：ghcr.io/izerok/gately-nav-builtin:test
# 用完即删；只要它还在分支上，每次推 plugin/nav-page 都会重新构建并重推 :test。
name: temp-nav-builtin-image-build
on:
  push:
    branches: [plugin/nav-page]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-push-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.builtin-nav
          tags: ghcr.io/izerok/gately-nav-builtin:test
          push: true
      - name: Smoke test (pushed image)
        run: |
          docker run -d --name gately-nav -p 16680:16680 ghcr.io/izerok/gately-nav-builtin:test
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:16680/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "admin http code: $code"
          [ "$code" = "000" ] && exit 1
          ok=0
          for i in $(seq 1 12); do
            if docker logs gately-nav 2>&1 | grep -q '\[builtin\] nav running'; then ok=1; break; fi
            sleep 5
          done
          docker logs gately-nav 2>&1 | tail -40
          docker ps --filter name=gately-nav
          [ "$ok" = "1" ] && echo 'SMOKE OK: nav running' || exit 1
